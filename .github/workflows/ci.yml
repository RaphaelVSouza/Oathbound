name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run unit tests
        run: node --test test/*.test.ts test/*/*.test.js

      - name: Audit documentation
        run: node tools/audit-docs.ts

      - name: Build native plugins
        run: |
          mkdir -p dist
          node tools/build-plugin.cjs claude dist/claude
          node tools/build-plugin.cjs agy dist/agy
