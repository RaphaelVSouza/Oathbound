name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run unit tests
        run: node --test "test/*.test.ts" "test/*.test.cjs" "test/*/*.test.js"

      - name: Audit documentation
        run: node tools/audit-docs.ts

      - name: Build native plugins
        shell: bash
        run: |
          mkdir -p dist
          node tools/build-plugin.cjs claude dist/claude
          node tools/build-plugin.cjs agy dist/agy

      - name: Validate Claude plugin entry points
        shell: bash
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.327 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.327 plugin validate dist/claude
