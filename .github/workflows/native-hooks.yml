name: Native Hooks

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: oathbound-hook-win32-x64.exe
            bin_path: native/oathbound-hook/target/release/oathbound-hook.exe
          - os: ubuntu-latest
            artifact: oathbound-hook-linux-x64
            bin_path: native/oathbound-hook/target/release/oathbound-hook
          - os: macos-latest
            artifact: oathbound-hook-darwin-arm64
            bin_path: native/oathbound-hook/target/release/oathbound-hook

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Run Rust unit tests
        run: cargo test --manifest-path native/oathbound-hook/Cargo.toml

      - name: Build oathbound-hook
        run: cargo build --release --manifest-path native/oathbound-hook/Cargo.toml

      - name: Run native hook integration tests
        run: node --test test/hooks/native-parity.test.js

      - name: Stage platform binary
        shell: bash
        run: |
          mkdir -p dist-native
          cp "${{ matrix.bin_path }}" "dist-native/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-native/${{ matrix.artifact }}
