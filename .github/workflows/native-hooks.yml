name: Native Hooks

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: oathbound-hook-win32-x64.exe
            bin_path: native/oathbound-hook/target/release/oathbound-hook.exe
          - os: ubuntu-latest
            artifact: oathbound-hook-linux-x64
            bin_path: native/oathbound-hook/target/release/oathbound-hook
          - os: macos-latest
            artifact: oathbound-hook-darwin-arm64
            bin_path: native/oathbound-hook/target/release/oathbound-hook

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build oathbound-hook
        run: cargo build --release --manifest-path native/oathbound-hook/Cargo.toml

      - name: Run native parity tests
        run: node --test test/hooks/native-parity.test.js

      - name: Stage platform binary
        shell: bash
        run: |
          mkdir -p dist-native
          cp "${{ matrix.bin_path }}" "dist-native/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-native/${{ matrix.artifact }}

  attach-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-native
          merge-multiple: true

      - name: Upload native binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist-native/oathbound-hook-win32-x64.exe \
            dist-native/oathbound-hook-linux-x64 \
            dist-native/oathbound-hook-darwin-arm64 \
            --clobber
