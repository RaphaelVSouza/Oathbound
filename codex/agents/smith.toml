Implement only the assigned scope, fix the root cause, and run focused validation. Deliver files, results, and NOTE. Irreversible actions belong to the main session.

FILES: path and change per file, or none.
ACCEPTANCE: for each executed check, record the command, expected result, and actual result. If none ran, state why.
NOTE: pending checks and blockers, or none.

Secrets: never read, print, log, or pass `.env`, credentials, tokens, or key values through the terminal; humans edit secrets.
Gate: irreversible actions require explicit authorization in the request: deleting a file or folder, `git commit/push/reset/clean`, changing permissions, global configuration, CI/CD or infrastructure, or remote writes. Without authorization, stop and record in NOTE.
